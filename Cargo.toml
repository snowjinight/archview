[package]
name = "archview"
version = "1.3.5"
authors = ["snowjinight"]
edition = "2021"

[dependencies]
# glow 后端：eframe 0.34 起默认 wgpu，须显式关闭默认特性指定 glow——
# mpv render API 需要拿 glow::Context 喂 get_proc_address（doc/架构设计/13_渲染架构迁移.md）
eframe = { version = "0.36", default-features = false, features = ["glow", "default_fonts", "accesskit"] }
egui = "0.36"
glow = "0.17"
zip = { version = "8", default-features = false, features = ["deflate", "aes-crypto"] }
rfd = "0.17"
libloading = "0.8"
raw-window-handle = "0.6"
winit = { version = "0.30", default-features = false }
serde = { version = "1", features = ["derive"] }
toml = "0.9"
# config.toml 缺失键补全回写：保留用户注释/键序，需逐项编辑 TOML 文档
# （toml 0.9 序列化只产生裸 TOML，会抹掉注释）
toml_edit = "0.23"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sevenz-rust = { version = "0.6.1", features = ["aes256"] }
unrar = "0.5.8"
encoding_rs = "0.8"
alphanumeric-sort = "1.5"
# 高级搜索（search_engine）通配符 * ? 展开为正则；
# 已是 unrar 的间接依赖，显式声明不增加实际编译产物
regex = "1"
# 图片解码（静态图 egui 纹理直显）：只启用媒体配置里出现的格式，
# 避免默认特性的 avif/openexr 等重依赖拖慢编译
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp", "tiff", "ico", "tga"] }
# 相机 RAW（Sony ARW 家族 + Nikon NEF 家族）内嵌 JPEG 预览提取：
# 纯 Rust、零依赖、forbid(unsafe)，畸形文件只报错不 panic
raw-files = "0.6"
# 图片重采样 SIMD 加速（同一套 Lanczos3 核，SSE4/AVX2 向量化，33MP 级
# 600ms→~80ms）：full 高清档与基础档预放大共用
fast_image_resize = "5"
egui_alignments = "0.3.9"
# EXIF 读取（内存 buffer 支持，zip 流路径必需）：解码链方向矫正
kamadak-exif = "0.6"
# EXIF 写入（纯 Rust，JPEG/PNG/TIFF/WebP-lossless）：旋转写回文件元数据 + EXIF tag 编码
little_exif = "0.6"
# 容器级手术（纯 Rust）：JPEG APP1/PNG chunk/RIFF WebP 增删改——评级嵌入式 XMP
# 注入 + PNG eXIf 方向写回（替代原手写 chunk 注入，CRC 由库内计算）
img-parts = "0.4"
# 用户文件删除进回收站（不直接 fs::remove）：按星级删除
trash = "5"

[build-dependencies]
winresource = "0.1"

# debug 构建下依赖（image 编解码等 CPU 密集库）仍走 O2 优化：
# 否则解码比 release 慢 10~30 倍，图片直显出现可见占位闪烁
[profile.dev.package."*"]
opt-level = 2

[dependencies.windows-sys]
version = "0.61"
features = [
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_Graphics_Gdi",
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_DataExchange",
    "Win32_Graphics_OpenGL",
    "Win32_System_LibraryLoader",
]
