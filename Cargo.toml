[package]
name = "archview"
version = "1.0.0"
edition = "2021"

[dependencies]
# glow 后端：eframe 0.34 起默认 wgpu，须显式关闭默认特性指定 glow——
# mpv render API 需要拿 glow::Context 喂 get_proc_address（ARCHITECTURE.md 13）
eframe = { version = "0.36", default-features = false, features = ["glow", "default_fonts", "accesskit"] }
egui = "0.36"
glow = "0.17"
zip = { version = "8", default-features = false, features = ["deflate", "aes-crypto"] }
rfd = "0.17"
libloading = "0.8"
raw-window-handle = "0.6"
winit = { version = "0.30", default-features = false }
serde = { version = "1", features = ["derive"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sevenz-rust = { version = "0.6.1", features = ["aes256"] }
unrar = "0.5.8"
encoding_rs = "0.8"
alphanumeric-sort = "1.5"

[build-dependencies]
winresource = "0.1"

[dependencies.windows-sys]
version = "0.61"
features = [
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_SystemInformation",
    "Win32_Graphics_OpenGL",
    "Win32_System_LibraryLoader",
]
